tag: dense-baseline+multilingual

actor:
  # The name of the team
  team: air5

# Please provide a short description of your system.
research goal:
  description: |
    Evaluate the temporal robustness of a dense retrieval system using SBERT on French web data.
    This system serves as a multilingual dense baseline using a SentenceTransformer model
    (distiluse-base-multilingual-cased-v1). FAISS was used for efficient approximate nearest neighbor
    search. Evaluated across multiple LAGs (e.g., 2023-03 to 2023-08) to assess stability over time.


platform:
  software:
    libraries:
      - sentence-transformers (SBERT embedding)
      - faiss (dense vector indexing & retrieval)
      - scikit-learn (PCA for dimensionality reduction)
      - pytrec_eval (evaluation)
      - Python 3.11
      - CUDA 12.4

implementation:
  source:
    repository: https://github.com/michael-kinzkofer92/longeval-webretrieval-2025

data:
  training data:
    - name: longeval-web

method:
  automatic: true

  indexing:
    tokenizer: default SBERT tokenizer
    stemmer: none
    stopwords: none
    dimensionality reduction: PCA to 128 dims

  retrieval:
    - name: dense


      ##################################################
      # Yes/No Questions
      ##################################################

      lexical: no
      deep_neural_model: yes
      sparse_neural_model: no
      dense_neural_model: yes
      single_stage_retrieval: yes
