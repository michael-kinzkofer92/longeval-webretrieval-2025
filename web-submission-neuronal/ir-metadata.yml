tag: bm25+luyu+neuronal

actor:
  team: air5

research goal:
  description: |
    Improve initial BM25 retrieval results using a neural re-ranking strategy.
    This system uses a lightweight cross-encoder (Luyu) to rerank top-k BM25 results, 
    and evaluates performance stability across lags in the LongEval WebRetrieval setting.

platform:
  software:
    libraries:
      - HuggingFace Transformers
      - pytrec_eval
      - Python 3.10

implementation:
  source:
    repository: https://github.com/michael-kinzkofer92/longeval-webretrieval-2025

data:
  training data:
    - name: longeval-web

method:
  automatic: true

  indexing:
    tokenizer: StandardTokenizer
    stemmer: FrenchLightStemmer
    stopwords: stopwords-fr.txt + train24-top125-nominmaxlen.txt

  retrieval:
    - name: bm25 + luyu (cross-encoder)

      ##################################################
      # Yes/No Questions
      ##################################################

      lexical: yes
      deep_neural_model: yes
      sparse_neural_model: no
      dense_neural_model: no
      single_stage_retrieval: no
