tag: bm25-baseline+traditional

actor:
  # The name of the team
  team: air5

# Please provide a short description of your system.
research goal:
  description: |
    Evaluate the temporal robustness of a traditional IR system using BM25 on French web data.
    This system serves as a lexical baseline using a custom Lucene index with French-specific 
    preprocessing. It is evaluated across multiple lags (e.g., Lag6 and Lag8) to assess retrieval 
    stability over time.

platform:
  software:
    libraries:
      - Pyserini (BM25 indexing & retrieval)
      - Apache Lucene (custom Java indexer with FrenchAnalyzer)
      - pytrec_eval (evaluation)
      - Python 3.10
      - Java 17

implementation:
  source:
    repository: https://github.com/michael-kinzkofer92/longeval-webretrieval-2025

data:
  training data:
    - name: longeval-web

method:
  automatic: true

  indexing:
    tokenizer: StandardTokenizer
    stemmer: FrenchLightStemmer
    stopwords: stopwords-fr.txt + train24-top125-nominmaxlen.txt

  retrieval:
    - name: bm25

      ##################################################
      # Yes/No Questions
      ##################################################

      lexical: yes
      deep_neural_model: no
      sparse_neural_model: no
      dense_neural_model: no
      single_stage_retrieval: yes
